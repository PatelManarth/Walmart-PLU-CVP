name: Validate CVP site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JavaScript syntax
        run: node --check app-1.js && node --check app-2.js && node --check app-3.js && node --check app-4.js && node --check app-5.js && node --check app-6.js && node --check sw.js
      - name: Validate produce dataset
        run: python tests/test_data.py
      - name: Validate manifest JSON
        run: python -m json.tool manifest.webmanifest >/dev/null
